<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - eDoc</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .auth-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            z-index: -1;
        }

        .auth-background::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite;
        }

        .auth-background::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 10s ease-in-out infinite reverse;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-xl);
            animation: fadeIn 0.6s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .input-with-icon {
            padding-left: 3rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .alert {
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--color-error);
            color: var(--color-error);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--color-success);
            color: var(--color-success);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-option {
            position: relative;
        }

        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .role-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
        }

        .role-card i {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            transition: transform var(--transition-normal);
        }

        .role-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-4px);
        }

        .role-card:hover i {
            transform: scale(1.1);
        }

        .role-option input[type="radio"]:checked+.role-card {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-background"></div>

        <div class="auth-card">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>

            <div class="auth-header">
                <div class="auth-logo">Create Account</div>
                <p class="text-muted">Join eDoc and start booking appointments</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">I am a:</label>
                    <div class="role-selector">
                        <div class="role-option">
                            <input type="radio" name="role" id="rolePatient" value="patient" checked>
                            <label for="rolePatient" class="role-card">
                                <i class="fas fa-user"></i>
                                <strong>Patient</strong>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" id="roleDoctor" value="doctor">
                            <label for="roleDoctor" class="role-card">
                                <i class="fas fa-user-md"></i>
                                <strong>Doctor</strong>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Full Name:</label>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="form-input input-with-icon" id="name"
                            placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email:</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-input input-with-icon" id="email"
                            placeholder="your.email@example.com" required>
                    </div>
                </div>

                <div class="form-group" id="specialtyGroup" style="display: none;">
                    <label class="form-label">Specialty:</label>
                    <div class="input-group">
                        <i class="fas fa-stethoscope input-icon"></i>
                        <select class="form-select input-with-icon" id="specialty">
                            <option value="">Select specialty</option>
                            <option value="Accident and emergency">Accident and emergency</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="General Practice">General Practice</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Psychiatry">Psychiatry</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone (Optional):</label>
                    <div class="input-group">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="form-input input-with-icon" id="phone" placeholder="+1234567890">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password:</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-input input-with-icon" id="password"
                            placeholder="Create a strong password" required minlength="3">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password:</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-input input-with-icon" id="confirmPassword"
                            placeholder="Re-enter your password" required minlength="3">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" id="registerBtn">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p class="text-muted">
                    Already have an account?
                    <a href="login.html" style="color: var(--color-primary); text-decoration: none; font-weight: 600;">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const alertBox = document.getElementById('alert');
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const specialtyGroup = document.getElementById('specialtyGroup');
        const specialtySelect = document.getElementById('specialty');

        // Show/hide specialty field based on role
        roleInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                if (e.target.value === 'doctor') {
                    specialtyGroup.style.display = 'block';
                    specialtySelect.required = true;
                } else {
                    specialtyGroup.style.display = 'none';
                    specialtySelect.required = false;
                }
            });
        });

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const phone = document.getElementById('phone').value;
            const specialty = document.getElementById('specialty').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match!');
                return;
            }

            // Validate specialty for doctors
            if (role === 'doctor' && !specialty) {
                showAlert('Please select a specialty');
                return;
            }

            // Show loading state
            registerBtn.innerHTML = '<span class="loading"></span> Creating account...';
            registerBtn.disabled = true;

            try {
                const requestData = {
                    name,
                    email,
                    password,
                    role,
                    phone: phone || null
                };

                if (role === 'doctor') {
                    requestData.specialty = specialty;
                }

                const response = await fetch('api/auth/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Account created successfully! Redirecting to login...', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Registration failed. Please try again.');
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.');
                console.error('Registration error:', error);
            } finally {
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                registerBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
